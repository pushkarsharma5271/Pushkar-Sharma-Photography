<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pushkar Sharma | Photography Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/d5ccd55f94.js" crossorigin="anonymous"></script>
</head>


<body>
    <header>
        <div class="container">
            <h1>Pushkar Sharma</h1>
            <p>Photography Portfolio</p>
        </div>
    </header>





    <!-- About Me -->
    <section class="about">
        <!-- Profile Photo -->
        <img class="profilePhoto" src="Assets/Images/Profile Photo/Pushkar Profile Photo.jpg"
            alt="Pushkar's Profile Photo">

        <div class="container">
            <h2>About Me</h2>
            <p>Hi, I'm Pushkar Sharma, a passionate photographer capturing moments that tell a story. Welcome to my
                portfolio!</p>
        </div>
    </section>





    <!-- Gallery -->

    <section class="gallery">
        <div class="container">
            <h2>Gallery</h2>
            <div class="gallery-grid">
                <img src="Assets/Images/McLeod Ganj.jpg" alt="McLeod Ganj">
                <img src="Assets/Images/Mountain View.jpg" alt="Mountain View">
                <img src="Assets/Images/Snowy Track.png" alt="Snowy Track">
                <img src="Assets/Images/Nainital Evening.jpg" alt="Nainital Evening">
            </div>
            <a href="gallery.html" class="view-more-btn">View More</a>
        </div>
    </section>
    




<!-- Social Media -->
<section class="social-media">
    <div class="container">
        <h2>Connect with Me</h2>
        <div class="social-links">
            <a href="https://instagram.com" target="_blank" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://facebook.com" target="_blank" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
        </div>
    </div>
</section>


    <footer>
        <p>&copy; 2025 Pushkar Sharma. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
